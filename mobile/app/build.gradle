plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nesem.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nesem.app'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs += 'src/main/jniLibs'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
